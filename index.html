<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>냥냥 홈페이지</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: "Arial", sans-serif;
    }

    body{
      background:#fff7f0;
      color:#333;
    }

    header{
      height:100vh;
      background:linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
      url('https://images.unsplash.com/photo-1518791841217-8f162f1e1131?q=80&w=1600&auto=format&fit=crop');
      background-size:cover;
      background-position:center;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:white;
      padding:20px;
    }

    header h1{
      font-size:60px;
      margin-bottom:15px;
    }

    header p{
      font-size:22px;
      margin-bottom:25px;
    }

    .btn{
      padding:14px 28px;
      border:none;
      border-radius:30px;
      background:#ff914d;
      color:white;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#ff6b00;
      transform:scale(1.05);
    }

    section{
      padding:80px 20px;
      max-width:1100px;
      margin:auto;
    }

    h2{
      text-align:center;
      margin-bottom:40px;
      font-size:36px;
      color:#ff6b00;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
    }

    .card{
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 8px 20px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-10px);
    }

    .card img{
      width:100%;
      height:220px;
      object-fit:cover;
    }

    .card-content{
      padding:20px;
    }

    .card-content h3{
      margin-bottom:10px;
      color:#ff6b00;
    }

    footer{
      background:#222;
      color:white;
      text-align:center;
      padding:25px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🐱 냥냥 월드</h1>
    <p>귀여운 고양이들을 위한 홈페이지</p>
    <button class="btn" onclick="catMessage()">야옹 버튼</button>
  </header>

  <section>
    <h2>인기 고양이</h2>

    <div class="cards">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1519052537078-e6302a4968d4?q=80&w=1200&auto=format&fit=crop" alt="고양이">
        <div class="card-content">
          <h3>치즈냥</h3>
          <p>햇빛 아래 낮잠 자는 걸 좋아하는 고양이입니다.</p>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1495360010541-f48722b34f7d?q=80&w=1200&auto=format&fit=crop" alt="고양이">
        <div class="card-content">
          <h3>검은냥</h3>
          <p>도도하지만 사실 애교가 엄청 많아요.</p>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1511044568932-338cba0ad803?q=80&w=1200&auto=format&fit=crop" alt="고양이">
        <div class="card-content">
          <h3>아기냥</h3>
          <p>세상을 탐험하는 호기심 많은 아기 고양이!</p>
        </div>
      </div>

    </div>
  </section>

  <footer>
    <p>🐾 2026 냥냥 월드 | Cat Lovers Forever</p>
  </footer>

  <script>
    function catMessage(){
      alert("야옹~ 😺 냥냥 월드에 온 걸 환영해!");
    }
  </script>

</body>
</html>
